name: AI Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Trusted base code only: never check out or execute fork/PR code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Explain fork safety restriction
        if: github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pds301m-ai-review -->';
            const body = `${marker}\n# Automated Project Review\n\nAI augmentation skipped: fork pull requests do not receive repository AI secrets. Deterministic Quality Check still runs.\n\n_Advisory only._`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number});
            const prior = comments.find(comment => comment.body.includes(marker));
            if (prior) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: prior.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Fetch PR diff from GitHub API
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate -H "Accept: application/vnd.github.v3.diff" "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr.diff"
      - name: Generate advisory review
        if: github.event.pull_request.head.repo.fork == false
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_ENDPOINT: ${{ vars.AI_REVIEW_ENDPOINT }}
        run: python -m scripts.ai_review.reviewer --diff-file "$RUNNER_TEMP/pr.diff" --output "$RUNNER_TEMP/review.md"
      - name: Publish or update advisory review
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ runner.temp }}/review.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pds301m-ai-review -->';
            const body = fs.readFileSync(process.env.REVIEW_FILE, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number});
            const prior = comments.find(comment => comment.body.includes(marker));
            if (prior) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: prior.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
